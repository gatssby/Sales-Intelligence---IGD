services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-intelligence-postgres
    restart: unless-stopped
    env_file:
      - ./postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sales_intelligence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  sales_intelligence_pgdata:
    name: sales_intelligence_pgdata
