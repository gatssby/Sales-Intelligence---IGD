services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-intelligence-postgres
    restart: unless-stopped
    env_file:
      - ./postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sales_intelligence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ${SALES_APP_SOURCE:-./current}
      dockerfile: Dockerfile
    image: sales-intelligence-web:current
    container_name: sales-intelligence-web
    restart: unless-stopped
    init: true
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sales_intelligence_pgdata:
    name: sales_intelligence_pgdata
