server {
    listen 80;
    listen [::]:80;
    server_name sales-igd.com.br www.sales-igd.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://sales-igd.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sales-igd.com.br;

    ssl_certificate /etc/letsencrypt/live/sales-igd.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales-igd.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sales-igd.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sales-igd.com.br;

    ssl_certificate /etc/letsencrypt/live/sales-igd.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales-igd.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Sales Intelligence IGD";
    auth_basic_user_file /etc/nginx/.htpasswd-sales-igd;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
